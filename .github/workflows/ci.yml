name: CI

# 매 푸시·PR마다 기계가 자동 검증(안전망): 타입 → 유닛테스트 → 린트.
# 빨간불이면 여기서 멈춰 prod로 안 넘어감.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm test
      - name: Lint (비차단 — 리포트만)
        run: npm run lint
        continue-on-error: true
