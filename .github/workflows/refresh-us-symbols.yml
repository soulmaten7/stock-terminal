# US 유니버스 일일 재생성(STEP 754·755) — 변경 있으면 자동 커밋 → Vercel 자동배포.
name: refresh-us-symbols
on:
  schedule:
    # 매일 09:00 UTC(새벽 4~5시 ET) — 나스닥 디렉토리 nightly 갱신 후·개장 전.
    # 변경 없으면 no-op(커밋 안 함) → 비용≈0. 같은 날 22:00 UTC us-perf가 신규 종목 시세 채움 = 익일 보드 편입(KR 동급).
    # ⚠️ GitHub는 60일 무커밋 리포의 스케줄 워크플로를 조용히 비활성화함 — 일일 diff 커밋이 타이머를 리셋하므로
    #    실질 무해하나, 장기 개발 중단 시 Actions 탭에서 워크플로 활성 상태 확인할 것.
    - cron: "0 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx tsx scripts/refresh_us_symbols.ts
      - name: commit if changed
        run: |
          if ! git diff --quiet data/us_symbols.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/us_symbols.json
            git commit -m "chore: daily US universe refresh (nasdaqtrader symbol directory)"
            git push
          else
            echo "no changes"
          fi
